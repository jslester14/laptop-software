---
# tasks file for dotnet
- name: ensure .dotnet directory
  ansible.builtin.file:
    path: /home/{{ user_name }}/.dotnet
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    state: directory
- name: download dotnet install script
  become: yes
  become_user: "{{ user_name }}"
  ansible.builtin.get_url:
    url: https://dot.net/v1/dotnet-install.sh
    dest: /home/{{ user_name }}/.dotnet/dotnet-install.sh
    mode: '0755'
- name: install dotnet runtime
  become: yes
  become_user: "{{ user_name }}"
  shell:
    /home/{{ user_name }}/.dotnet/dotnet-install.sh
  args:
    creates: /home/{{ user_name }}/.dotnet/dotnet
- name: add dotnet to path
  become: yes
  become_user: "{{ user_name }}"
  ansible.builtin.blockinfile:
    path: /home/{{ user_name }}/.bashrc
    block: |
      export PATH=/home/{{ user_name }}/.dotnet:$PATH
