---
- name: Ensure dependencies are installed
  apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  loop:
    - ca-certificates
    - curl
    - apt-transport-https
    - lsb-release
    - gnupg

- name: Add Microsoft APT repository key
  apt_key:
    url: https://packages.microsoft.com/keys/microsoft.asc
    state: present

- name: Add Azure CLI repository
  apt_repository:
    repo: deb [arch=amd64] https://packages.microsoft.com/repos/azure-cli/ jammy main
    state: present

- name: Install Azure CLI
  apt:
    name: azure-cli
    state: present
    update_cache: yes