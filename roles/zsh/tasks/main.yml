---
# tasks file for zsh
- name: Install zsh Package
  apt:
    pkg:
    - zsh

- name: git oh-my-zsh/oh-my-zsh
  git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "/home/{{ user_name }}/.oh-my-zsh"
    depth: 1
    update: no
  become: yes
  become_user: "{{ user_name }}"

# Fixes clones made by earlier runs as root (oh-my-zsh warns about insecure dirs).
# Must run before the other clones, which run as the user.
- name: Ensure oh-my-zsh is owned by the user
  file:
    path: "/home/{{ user_name }}/.oh-my-zsh"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    recurse: yes

- name: git spaceship
  git:
    repo: https://github.com/spaceship-prompt/spaceship-prompt.git
    dest: "/home/{{ user_name }}/.oh-my-zsh/custom/themes/spaceship-prompt"
    depth: 1
  become: yes
  become_user: "{{ user_name }}"

- name: Link spaceship theme
  file:
    state: link
    src: "/home/{{ user_name }}/.oh-my-zsh/custom/themes/spaceship-prompt/spaceship.zsh-theme"
    path: "/home/{{ user_name }}/.oh-my-zsh/custom/themes/spaceship.zsh-theme"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"

- name: Write .zshrc
  template:
    src: zshrc.j2
    dest: "/home/{{ user_name }}/.zshrc"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0644"
    backup: yes

- name: Create .zshrc.local for secrets (never overwritten)
  template:
    src: zshrc.local.j2
    dest: "/home/{{ user_name }}/.zshrc.local"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0600"
    force: no

- name: Set default shell to zsh
  user:
    name: "{{ user_name }}"
    shell: /usr/bin/zsh
